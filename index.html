<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔤 AIワードパズル Pro</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #090d16; color: white; 
      margin: 0; padding: 0; 
      height: 100dvh; display: flex; flex-direction: column; 
      overflow: hidden; 
    }

    /* 1. ヘッダー：設定とスコア */
    .header { 
      padding: 10px; background: #1e293b; 
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid #334155;
    }
    input[type="password"] { 
      flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; 
      background: #0f172a; color: white; font-size: 11px; 
    }
    .bgm-btn { padding: 8px 12px; font-size: 12px; border-radius: 6px; border: none; background: #334155; color: white; cursor: pointer; }

    /* 2. 情報エリア：AIログと画像 */
    .info-area {
      display: flex; gap: 8px; padding: 8px; background: #0f172a; height: 90px;
    }
    .log-box { 
      flex: 1; background: #1e293b; border-radius: 8px; padding: 6px; 
      font-size: 11px; overflow-y: auto; border: 1px solid #38bdf8;
    }
    .photo-frame { 
      width: 74px; height: 74px; background: #000; border-radius: 8px; 
      border: 1px solid #38bdf8; overflow: hidden; flex-shrink: 0;
    }
    #wordImage { width: 100%; height: 100%; object-fit: cover; }

    /* 3. ゲーム盤面：中央に大きく */
    .game-main { 
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 5px; background: #090d16;
    }
    #gameCanvas { 
      background: #000; border: 2px solid #38bdf8; border-radius: 8px;
      max-height: 100%; width: auto; aspect-ratio: 6 / 10;
    }
    .score-label { color: #38bdf8; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .score-val { font-size: 24px; color: #fff; }

    /* 4. コントローラー：下部に固定 */
    .controls { 
      padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); 
      background: #1e293b; 
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      border-top: 1px solid #334155;
    }
    .btn { 
      padding: 16px 0; background: #334155; color: white; border: none; 
      border-radius: 12px; font-size: 20px; font-weight: bold; 
      box-shadow: 0 4px 0 #000;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { 
      grid-column: span 3; background: #e11d48; font-size: 16px; 
      box-shadow: 0 4px 0 #9f1239; padding: 14px 0;
    }
  </style>
</head>
<body>

<div class="header">
  <input type="password" id="apiKey" placeholder="Gemini Key" />
  <button class="bgm-btn" onclick="toggleBGM()" id="bgmToggle">🎵 BGM</button>
  <div style="text-align: right;">
    <div style="font-size: 9px; color: #94a3b8;">SCORE</div>
    <div class="score-val" id="scoreDisplay" style="font-size: 18px; font-weight: bold; color: #38bdf8;">0</div>
  </div>
</div>

<div class="info-area">
  <div class="log-box" id="logBox">
    <div style="color: #64748b;">文字を並べて判定ボタンを押そう！</div>
  </div>
  <div class="photo-frame">
    <img id="wordImage" style="display:none;">
  </div>
</div>

<div class="game-main">
  <canvas id="gameCanvas" width="240" height="400"></canvas>
  <div id="statusMsg" style="font-size:10px; color:#38bdf8; height:14px; margin-top:4px;"></div>
</div>

<div class="controls">
  <div class="btn" onpointerdown="moveLeft()">◀</div>
  <div class="btn" onpointerdown="dropFast()">▼</div>
  <div class="btn" onpointerdown="moveRight()">▶</div>
  <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ言葉を判定して消去</button>
</div>

<script>
  // --- 基本設定 ---
  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let audioCtx = null;
  let isBgmOn = false;
  let bgmInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  // --- ゲームロジック ---
  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      alert("GAME OVER! Score: " + score);
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0; updateScoreDisplay();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8", false);
      }
    }
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff", true);
  }

  function drawBlock(x, y, char, bg, textColor, isActive) {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 8);
    ctx.fill();
    if(isActive) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    
    ctx.fillStyle = textColor;
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !board[ny][nx];
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); } }

  // --- AI判定 & 消去ロジック ---
  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("API Keyを入力してください");

    const judgeBtn = document.getElementById('judgeBtn');
    const statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    let horizontalWords = [];
    for (let r = 0; r < ROWS; r++) {
      let line = board[r].map(c => c || ' ').join('');
      line.split(' ').forEach(s => { if(s.length >= 2) horizontalWords.push(s); });
    }
    let verticalWords = [];
    for (let c = 0; c < COLS; c++) {
      let line = "";
      for (let r = 0; r < ROWS; r++) line += (board[r][c] || ' ');
      line.split(' ').forEach(s => { if(s.length >= 2) verticalWords.push(s); });
    }

    const allCandidates = [...new Set([...horizontalWords, ...verticalWords])];
    if (allCandidates.length === 0) { judgeBtn.disabled = false; return; }

    const prompt = `日本語判定。以下から意味の通じる単語のみ抽出しJSONで返せ。リスト: ${JSON.stringify(allCandidates)}
形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "解説", "photo_en": "Prompt"}]}`;

    try {
      statusMsg.textContent = "AI判定中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const lastModel = localStorage.getItem('last_working_word_model') || models[0].name;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${lastModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      });

      if (response.ok) {
        const data = await response.json();
        const result = JSON.parse(data.candidates[0].content.parts[0].text);
        if (result.valid_words && result.valid_words.length > 0) {
          playSound('success');
          result.valid_words.forEach(w => {
            addLog(w.word, w.score, w.comment);
            score += w.score;
            eraseWordFromBoard(w.word);
            if (w.photo_en) showImage(w.photo_en);
          });
          applyGravity();
          updateScoreDisplay();
          localStorage.setItem('last_working_word_model', lastModel);
        }
      }
    } catch (err) { console.error(err); }
    finally { judgeBtn.disabled = false; statusMsg.textContent = ""; draw(); }
  }

  function eraseWordFromBoard(word) {
    for (let r = 0; r < ROWS; r++) {
      let rowStr = board[r].map(c => c || ' ').join('');
      let idx = rowStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[r][idx + i] = null;
    }
    for (let c = 0; c < COLS; c++) {
      let colStr = "";
      for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      let idx = colStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[idx + i][c] = null;
    }
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let emptyRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          let temp = board[r][c];
          board[r][c] = null;
          board[emptyRow][c] = temp;
          emptyRow--;
        }
      }
    }
  }

  function updateScoreDisplay() { document.getElementById('scoreDisplay').textContent = score; }
  function addLog(word, pts, comment) {
    const box = document.getElementById('logBox');
    const div = document.createElement('div');
    div.innerHTML = `<b style="color:#4ade80;">『${word}』</b> +${pts}pt<br>${comment}`;
    box.prepend(div);
  }
  function showImage(p) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", cute 3D render") }?width=200&height=200&nologo=true`;
    img.style.display = 'block';
  }

  function playSound(t) {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(t==='move'){ o.frequency.value=400; g.gain.value=0.05; o.start(); o.stop(audioCtx.currentTime+0.05); }
    if(t==='success'){ [523,659,784].forEach((f,i)=>{
      const oo=audioCtx.createOscillator(); const gg=audioCtx.createGain();
      oo.connect(gg); gg.connect(audioCtx.destination); oo.frequency.value=f;
      gg.gain.setValueAtTime(0.1, audioCtx.currentTime+i*0.1); oo.start(audioCtx.currentTime+i*0.1); oo.stop(audioCtx.currentTime+i*0.1+0.2);
    });}
  }

  function toggleBGM() {
    if(!audioCtx) audioCtx = new AudioContext();
    isBgmOn = !isBgmOn;
    document.getElementById('bgmToggle').style.background = isBgmOn ? "#e11d48" : "#334155";
    if(isBgmOn) {
      bgmInterval = setInterval(() => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.type='triangle';
        o.frequency.value=[261,329,392][Math.floor(Math.random()*3)]; g.gain.value=0.02;
        o.start(); o.stop(audioCtx.currentTime+0.2);
      }, 300);
    } else clearInterval(bgmInterval);
  }

  spawnPiece();
  setInterval(update, 1000);
</script>
</body>
</html>
