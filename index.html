<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔤 AIワードパズルDrop</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .app-container { display: flex; flex-direction: column; gap: 10px; max-width: 450px; width: 100%; }
    .card { background: #1e293b; border-radius: 16px; padding: 12px; border: 1px solid #334155; }
    
    .header-area { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    input[type="password"] { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 11px; }
    .score-val { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .sound-btn { padding: 6px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    .game-section { text-align: center; display: flex; flex-direction: column; align-items: center; }
    #gameCanvas { background: #090d16; border: 3px solid #38bdf8; border-radius: 8px; touch-action: none; max-width: 100%; height: auto; }
    
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 8px; }
    .btn { padding: 12px 0; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; user-select: none; }
    .btn:active { background: #0369a1; transform: scale(0.96); }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 15px; }
    .btn-judge:active { background: #be123c; }

    .ai-result-area { display: flex; gap: 10px; }
    .log-box { flex: 1; background: #0f172a; border-radius: 8px; padding: 8px; border: 1px solid #334155; height: 100px; overflow-y: auto; font-size: 12px; }
    .log-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #334155; }
    .word-title { font-weight: bold; color: #4ade80; font-size: 13px; }

    .photo-frame { width: 100px; height: 100px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; flex-shrink: 0; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card header-area">
    <input type="password" id="apiKey" placeholder="Gemini API Keyを入力" />
    <button class="sound-btn" id="bgmToggle" onclick="toggleBGM()">🎵 BGM: OFF</button>
    <div>SCORE: <span class="score-val" id="scoreDisplay">0</span></div>
  </div>

  <div class="card game-section">
    <canvas id="gameCanvas" width="240" height="400"></canvas>
    <div class="mobile-controls">
      <div class="btn" onclick="moveLeft()">◀</div>
      <div class="btn" onclick="dropFast()">▼</div>
      <div class="btn" onclick="moveRight()">▶</div>
      <div class="btn btn-judge" onclick="checkWords()">💡 単語判定！</div>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">🧠 Gemini判定 ＆ ビジュアル</div>
    <div class="ai-result-area">
      <div class="log-box" id="logBox">
        <div style="color: #64748b;">文字を並べて「単語判定！」を押してね！</div>
      </div>
      <div class="photo-frame">
        <img id="wordImage" alt="Word Image">
      </div>
    </div>
  </div>
</div>

<script>
  // --------------------------------------------------
  // 🔊 サウンド機能（Web Audio APIによる本格レトロBGM）
  // --------------------------------------------------
  let audioCtx = null;
  let isBgmOn = false;
  let bgmInterval = null;
  let step = 0;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'move') {
      osc.frequency.setValueAtTime(300, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'drop') {
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'success') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.08);
        g.gain.setValueAtTime(0.12, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.15);
      });
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(120, now + 0.1);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  }

  // リズミカルなBGM（メロディ ＋ ベース ＋ ノイズドラム）
  const melody = [261.63, 0, 329.63, 392.00, 523.25, 392.00, 329.63, 0, 293.66, 0, 349.23, 440.00, 587.33, 440.00, 349.23, 0];
  const bass = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 196.00, 196.00];

  function toggleBGM() {
    initAudio();
    isBgmOn = !isBgmOn;
    const btn = document.getElementById('bgmToggle');
    btn.textContent = isBgmOn ? "🎵 BGM: ON" : "🎵 BGM: OFF";
    btn.style.background = isBgmOn ? "#e11d48" : "#0284c7";

    if (isBgmOn) {
      step = 0;
      bgmInterval = setInterval(() => {
        const now = audioCtx.currentTime;

        // メロディ
        const note = melody[step % melody.length];
        if (note > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(note, now);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.12);
        }

        // ベース
        const bassNote = bass[Math.floor(step / 2) % bass.length];
        if (step % 2 === 0) {
          const bOsc = audioCtx.createOscillator();
          const bGain = audioCtx.createGain();
          bOsc.type = 'triangle';
          bOsc.frequency.setValueAtTime(bassNote, now);
          bGain.gain.setValueAtTime(0.04, now);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          bOsc.connect(bGain); bGain.connect(audioCtx.destination);
          bOsc.start(now); bOsc.stop(now + 0.18);
        }

        // ドラム風ノイズ（ハイハット）
        if (step % 2 === 1) {
          const bufferSize = audioCtx.sampleRate * 0.03;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const nGain = audioCtx.createGain();
          nGain.gain.setValueAtTime(0.01, now);
          nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
          noise.connect(nGain); nGain.connect(audioCtx.destination);
          noise.start(now);
        }

        step++;
      }, 140); // テンポ調整（140msごと）
    } else {
      clearInterval(bgmInterval);
    }
  }

  // --------------------------------------------------
  // 🎮 ゲーム本体 & ロジック
  // --------------------------------------------------
  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","ん"];
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let gameInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      playSound('fail');
      alert("ゲームオーバー！");
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0;
      updateScore(0);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#0284c7");
      }
    }
    if (currentPiece) {
      drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#f59e0b");
    }
  }

  function drawBlock(x, y, char, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    ctx.fillStyle = "white";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && board[ny][nx]) return false;
    return true;
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; playSound('drop'); update(); } }

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const diffX = e.changedTouches[0].clientX - touchStartX;
    const diffY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 30) moveRight();
