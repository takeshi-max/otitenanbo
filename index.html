<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔤 AIワードパズル Pro</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #0f172a; color: white; 
      margin: 0; padding: 0; 
      height: 100vh; display: flex; flex-direction: column; 
      overflow: hidden; 
    }

    /* 上部ヘッダー */
    .header { 
      padding: 10px 15px; background: #1e293b; 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 2px solid #38bdf8; z-index: 10;
    }
    input[type="password"] { 
      width: 80px; padding: 5px; border-radius: 4px; border: 1px solid #475569; 
      background: #0f172a; color: white; font-size: 10px; 
    }
    .score-container { text-align: right; }
    .score-val { font-size: 24px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }

    /* メインゲームエリア */
    .game-area { 
      flex: 1; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; padding: 10px;
      position: relative;
    }
    #gameCanvas { 
      background: #090d16; border: 4px solid #334155; border-radius: 12px; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      max-height: 70vh; width: auto; height: auto;
    }

    /* AIログ・画像（オーバーレイ） */
    .ai-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; gap: 10px; pointer-events: none;
    }
    .log-box { 
      flex: 1; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(4px);
      border-radius: 12px; padding: 8px; font-size: 11px; height: 80px; 
      overflow-y: hidden; border: 1px solid rgba(56,189,248,0.3);
    }
    .photo-frame { 
      width: 80px; height: 80px; background: #000; border-radius: 12px; 
      border: 2px solid #38bdf8; overflow: hidden; flex-shrink: 0;
    }
    #wordImage { width: 100%; height: 100%; object-fit: cover; }

    /* 下部コントローラー */
    .controls { 
      padding: 15px; background: #1e293b; 
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      border-top: 2px solid #334155; padding-bottom: calc(15px + env(safe-area-inset-bottom));
    }
    .btn { 
      padding: 20px 0; background: #334155; color: white; border: none; 
      border-radius: 16px; font-size: 24px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { 
      grid-column: span 3; background: #e11d48; font-size: 18px; 
      box-shadow: 0 4px 0 #9f1239; margin-top: 5px; padding: 15px 0;
    }
    .btn-judge:disabled { background: #64748b; box-shadow: none; opacity: 0.6; }

    .status-line { font-size: 10px; color: #38bdf8; margin-bottom: 5px; height: 12px; }
  </style>
</head>
<body>

<div class="header">
  <input type="password" id="apiKey" placeholder="Gemini Key" />
  <div class="score-container">
    <div style="font-size: 10px; color: #94a3b8;">TOTAL SCORE</div>
    <div class="score-val" id="scoreDisplay">0</div>
  </div>
  <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="toggleBGM()" id="bgmToggle">🎵 BGM</button>
</div>

<div class="game-area">
  <div class="ai-overlay">
    <div class="log-box" id="logBox">
      <div style="color: #38bdf8;">文字を並べて「判定」してね！</div>
    </div>
    <div class="photo-frame">
      <img id="wordImage" style="display:none;">
    </div>
  </div>
  <canvas id="gameCanvas" width="240" height="400"></canvas>
  <div id="statusMsg" class="status-line"></div>
</div>

<div class="controls">
  <div class="btn" onpointerdown="moveLeft()">◀</div>
  <div class="btn" onpointerdown="dropFast()">▼</div>
  <div class="btn" onpointerdown="moveRight()">▶</div>
  <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ言葉を消去（判定）</button>
</div>

<script>
  // --- システム設定 ---
  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let audioCtx = null;
  let isBgmOn = false;
  let bgmInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  
  // APIキー自動保存
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  // --- ゲームロジック ---
  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      alert("ゲームオーバー！ Score: " + score);
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0; updateScoreDisplay();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 盤面描画
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8", false);
      }
    }
    // 落下中
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff", true);
  }

  function drawBlock(x, y, char, bg, textColor, isActive) {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 8);
    ctx.fill();
    if(isActive) { ctx.strokeStyle = "#fff"; ctx.stroke(); }
    
    ctx.fillStyle = textColor;
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    return nx >= 0 && nx < COLS && ny < ROWS && !board[ny][nx];
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); } }

  // --- AI単語判定 ＆ 消去 ＆ 重力 ---
  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入れてね");

    const judgeBtn = document.getElementById('judgeBtn');
    const statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    // 盤面から文字列抽出
    let horizontalWords = [];
    for (let r = 0; r < ROWS; r++) {
      let line = board[r].map(c => c || ' ').join('');
      line.split(' ').forEach(s => { if(s.length >= 2) horizontalWords.push(s); });
    }
    let verticalWords = [];
    for (let c = 0; c < COLS; c++) {
      let line = "";
      for (let r = 0; r < ROWS; r++) line += (board[r][c] || ' ');
      line.split(' ').forEach(s => { if(s.length >= 2) verticalWords.push(s); });
    }

    const allCandidates = [...new Set([...horizontalWords, ...verticalWords])];
    if (allCandidates.length === 0) { judgeBtn.disabled = false; return; }

    const prompt = `日本語判定。以下から実在する単語のみ抽出しJSONで返せ。
リスト: ${JSON.stringify(allCandidates)}
形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "解説", "photo_en": "Image prompt"}]}`;

    try {
      statusMsg.textContent = "AIスキャン中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a, b) => b.name.localeCompare(a.name));
      const lastModel = localStorage.getItem('last_working_word_model');
      const targetModels = lastModel ? [{name: lastModel}, ...models.filter(m => m.name !== lastModel)] : models;

      let success = false;
      for (const m of targetModels) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
          });

          if (response.ok) {
            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text);
            
            if (result.valid_words && result.valid_words.length > 0) {
              playSound('success');
              result.valid_words.forEach(w => {
                addLog(w.word, w.score, w.comment);
                score += w.score;
                eraseWordFromBoard(w.word); // 盤面から消去
                if (w.photo_en) showImage(w.photo_en);
              });
              applyGravity(); // 消えたら落とす
              updateScoreDisplay();
            }
            localStorage.setItem('last_working_word_model', m.name);
            success = true; break;
          }
        } catch (e) { continue; }
      }
    } catch (err) { console.error(err); }
    finally { judgeBtn.disabled = false; statusMsg.textContent = ""; draw(); }
  }

  // 盤面から特定の単語を消す（横・縦の両方を探す）
  function eraseWordFromBoard(word) {
    // 横方向
    for (let r = 0; r < ROWS; r++) {
      let rowStr = board[r].map(c => c || ' ').join('');
      let idx = rowStr.indexOf(word);
      while(idx !== -1) {
        for(let i=0; i<word.length; i++) board[r][idx + i] = null;
        idx = rowStr.indexOf(word, idx + 1);
      }
    }
    // 縦方向
    for (let c = 0; c < COLS; c++) {
      let colStr = "";
      for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      let idx = colStr.indexOf(word);
      while(idx !== -1) {
        for(let i=0; i<word.length; i++) board[idx + i][c] = null;
        idx = colStr.indexOf(word, idx + 1);
      }
    }
  }

  // 消去後の重力処理
  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let emptyRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          let temp = board[r][c];
          board[r][c] = null;
          board[emptyRow][c] = temp;
          emptyRow--;
        }
      }
    }
  }

  // --- 演出・サウンド ---
  function updateScoreDisplay() {
    document.getElementById('scoreDisplay').textContent = score;
  }

  function addLog(word, pts, comment) {
    const logBox = document.getElementById('logBox');
    const div = document.createElement('div');
    div.style.marginBottom = "5px";
    div.innerHTML = `<b style="color:#4ade80;">『${word}』</b> +${pts}pt<br>${comment}`;
    logBox.prepend(div);
  }

  function showImage(promptEn) {
    const img = document.getElementById('wordImage');
    const finalPrompt = encodeURIComponent(promptEn + ", cute 3D emoji style, neon lighting, dark background");
    img.src = `https://image.pollinations.ai/prompt/${finalPrompt}?width=200&height=200&nologo=true&model=flux`;
    img.style.display = 'block';
  }

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(type==='move') { osc.frequency.setValueAtTime(400, now); gain.gain.setValueAtTime(0.05, now); osc.start(); osc.stop(now+0.05); }
    if(type==='success') { 
      [523, 659, 784, 1046].forEach((f,i) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(f, now + i*0.08); g.gain.setValueAtTime(0.1, now + i*0.08);
        o.start(now + i*0.08); o.stop(now + i*0.08 + 0.2);
      });
    }
  }

  function toggleBGM() {
    initAudio(); isBgmOn = !isBgmOn;
    const btn = document.getElementById('bgmToggle');
    btn.style.background = isBgmOn ? "#e11d48" : "#334155";
    if(isBgmOn) {
      let s = 0;
      bgmInterval = setInterval(() => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'triangle'; o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime([261, 329, 392, 349][s%4], audioCtx.currentTime);
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        o.start(); o.stop(audioCtx.currentTime + 0.2); s++;
      }, 250);
    } else { clearInterval(bgmInterval); }
  }

  // 開始
  spawnPiece();
  setInterval(update, 1000);
</script>
</body>
</html>
