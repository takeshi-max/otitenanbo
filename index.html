<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔤 AIワードパズルDrop</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 10px; display: flex; justify-content: center; overflow: hidden; }
    .app-container { display: flex; flex-direction: column; gap: 10px; max-width: 450px; width: 100%; height: 100vh; }
    .card { background: #1e293b; border-radius: 16px; padding: 12px; border: 1px solid #334155; }
    
    .header-area { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    input[type="password"] { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 11px; outline: none; }
    .score-val { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .sound-btn { padding: 6px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .game-section { text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
    #gameCanvas { background: #090d16; border: 3px solid #38bdf8; border-radius: 8px; touch-action: none; width: 100%; max-width: 240px; height: auto; }
    
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 300px; margin-top: 8px; }
    .btn { padding: 15px 0; background: #334155; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; text-align: center; user-select: none; box-shadow: 0 4px 0 #0f172a; }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 16px; box-shadow: 0 4px 0 #9f1239; margin-top: 5px; }

    .ai-result-area { display: flex; gap: 10px; align-items: center; }
    .log-box { flex: 1; background: #0f172a; border-radius: 8px; padding: 8px; border: 1px solid #334155; height: 100px; overflow-y: auto; font-size: 11px; }
    .log-item { margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .word-title { font-weight: bold; color: #4ade80; }

    .photo-frame { width: 100px; height: 100px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 2px solid #38bdf8; flex-shrink: 0; position: relative; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; display: none; }
    .loading-spin { font-size: 10px; color: #64748b; position: absolute; top: 40%; width: 100%; text-align: center; }

    .status-msg { font-size: 10px; color: #94a3b8; text-align: center; margin-top: 4px; height: 12px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card header-area">
    <input type="password" id="apiKey" placeholder="Gemini API Key" />
    <button class="sound-btn" id="bgmToggle" onclick="toggleBGM()">🎵 BGM: OFF</button>
    <div>SCORE: <span class="score-val" id="scoreDisplay">0</span></div>
  </div>

  <div class="card game-section">
    <canvas id="gameCanvas" width="240" height="400"></canvas>
    <div id="statusMsg" class="status-msg"></div>
    <div class="mobile-controls">
      <div class="btn" onpointerdown="moveLeft()">◀</div>
      <div class="btn" onpointerdown="dropFast()">▼</div>
      <div class="btn" onpointerdown="moveRight()">▶</div>
      <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ文字を判定！</button>
    </div>
  </div>

  <div class="card">
    <div class="ai-result-area">
      <div class="log-box" id="logBox">
        <div style="color: #64748b;">判定した単語の歴史</div>
      </div>
      <div class="photo-frame">
        <div id="imgLoading" class="loading-spin" style="display:none;">生成中...</div>
        <img id="wordImage" alt="Word Image">
      </div>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  let isBgmOn = false;
  let bgmInterval = null;
  let step = 0;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'move') {
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.05, now);
      osc.start(); osc.stop(now + 0.05);
    } else if (type === 'success') {
      [523, 659, 784].forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(f, now + i*0.1);
        g.gain.setValueAtTime(0.1, now + i*0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.2);
        o.start(now+i*0.1); o.stop(now+i*0.1+0.2);
      });
    }
  }

  function toggleBGM() {
    initAudio();
    isBgmOn = !isBgmOn;
    const btn = document.getElementById('bgmToggle');
    btn.textContent = isBgmOn ? "🎵 BGM: ON" : "🎵 BGM: OFF";
    btn.style.background = isBgmOn ? "#e11d48" : "#0284c7";
    if (isBgmOn) {
      bgmInterval = setInterval(() => {
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime([261, 329, 392, 523][step%4], now);
        g.gain.setValueAtTime(0.01, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(now + 0.1);
        step++;
      }, 200);
    } else {
      clearInterval(bgmInterval);
    }
  }

  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let gameInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      alert("ゲームオーバー！ Score: " + score);
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0;
      document.getElementById('scoreDisplay').textContent = 0;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8");
      }
    }
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff");
  }

  function drawBlock(x, y, char, bg, textColor) {
    ctx.fillStyle = bg;
    ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    ctx.fillStyle = textColor;
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    return nx >= 0 && nx < COLS && ny < ROWS && !board[ny][nx];
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); } }

  // 🤖 AI探査 & 判定ロジック
  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");

    const judgeBtn = document.getElementById('judgeBtn');
    const statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    // 縦横の文字列を抽出
    let candidates = [];
    for (let r = 0; r < ROWS; r++) {
      let line = board[r].map(c => c || ' ').join('');
      candidates.push(...extractStrings(line));
    }
    for (let c = 0; c < COLS; c++) {
      let line = "";
      for (let r = 0; r < ROWS; r++) line += (board[r][c] || ' ');
      candidates.push(...extractStrings(line));
    }

    candidates = [...new Set(candidates)].filter(s => s.length >= 2);
    if (candidates.length === 0) {
      judgeBtn.disabled = false;
      return alert("単語（2文字以上）が見当たりません");
    }

    const prompt = `日本語パズル判定。以下のリストから実在する一般的な日本語単語（名詞・動詞等）を全て見つけ、JSONで返して。
リスト: ${JSON.stringify(candidates)}
形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "解説", "photo_en": "English image prompt"}]}`;

    try {
      // モデル探査
      statusMsg.textContent = "最適なAIモデルを探索中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if (!mRes.ok) throw new Error(mData.error?.message || "Key Error");

      const models = mData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent"))
        .sort((a, b) => b.name.localeCompare(a.name));

      const lastModel = localStorage.getItem('last_working_word_model');
      const targetModels = lastModel ? [{name: lastModel}, ...models.filter(m => m.name !== lastModel)] : models;

      let success = false;
      for (const m of targetModels) {
        statusMsg.textContent = `${m.name.split('/').pop()} で判定中...`;
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (response.ok) {
            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text);
            
            if (result.valid_words && result.valid_words.length > 0) {
              playSound('success');
              result.valid_words.forEach(w => {
                addLog(w.word, w.score, w.comment);
                score += w.score;
                if (w.photo_en) showImage(w.photo_en);
              });
              document.getElementById('scoreDisplay').textContent = score;
              // 消去演出（簡易的に盤面から単語を消す場合はここに記述）
            } else {
              addLog("なし", 0, "有効な単語なし");
            }
            localStorage.setItem('last_working_word_model', m.name);
            success = true;
            break;
          }
        } catch (e) { continue; }
      }
      if (!success) throw new Error("全モデルで拒否されました");

    } catch (err) {
      alert("AI判定エラー: " + err.message);
    } finally {
      judgeBtn.disabled = false;
      statusMsg.textContent = "";
    }
  }

  function extractStrings(line) {
    return line.split(' ').filter(s => s.length >= 2);
  }

  function addLog(word, pts, comment) {
    const logBox = document.getElementById('logBox');
    const div = document.createElement('div');
    div.className = "log-item";
    div.innerHTML = `<span class="word-title">『${word}』</span> (+${pts}pt)<br>${comment}`;
    logBox.prepend(div);
  }

  function showImage(promptEn) {
    const img = document.getElementById('wordImage');
    const loader = document.getElementById('imgLoading');
    loader.style.display = 'block';
    img.style.display = 'none';
    const finalPrompt = encodeURIComponent(promptEn + ", 3D render, cute style, vibrant colors");
    img.src = `https://image.pollinations.ai/prompt/${finalPrompt}?width=200&height=200&nologo=true&model=flux`;
    img.onload = () => { loader.style.display = 'none'; img.style.display = 'block'; };
  }

  spawnPiece();
  draw();
  gameInterval = setInterval(update, 1000);
</script>

</body>
</html>
