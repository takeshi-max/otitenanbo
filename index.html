<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔤 AIワードパズル Pro</title>
  <style>
    /* iPhoneのあらゆる自動操作（ズーム・スクロール）を禁止 */
    * { 
      box-sizing: border-box; 
      touch-action: none; 
      -webkit-user-select: none; 
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #090d16; color: white; 
      margin: 0; padding: 0; 
      height: 100dvh; display: flex; flex-direction: column; 
      overflow: hidden; 
      overscroll-behavior: none;
    }

    /* ヘッダー */
    .header { 
      padding: 10px; background: #1e293b; 
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid #334155;
    }
    input[type="password"] { 
      flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; 
      background: #0f172a; color: white; font-size: 11px; touch-action: auto;
    }
    .score-area { text-align: right; min-width: 50px; }
    .score-val { font-size: 18px; font-weight: bold; color: #38bdf8; }

    /* 情報エリア */
    .info-area {
      display: flex; gap: 8px; padding: 8px; background: #0f172a; height: 85px;
    }
    .log-box { 
      flex: 1; background: #1e293b; border-radius: 8px; padding: 6px; 
      font-size: 11px; overflow-y: auto; border: 1px solid #334155;
      touch-action: pan-y;
    }
    .photo-frame { 
      width: 68px; height: 68px; background: #000; border-radius: 8px; 
      border: 1px solid #38bdf8; overflow: hidden; flex-shrink: 0;
    }
    #wordImage { width: 100%; height: 100%; object-fit: cover; }

    /* ゲーム盤面 */
    .game-main { 
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 5px; position: relative;
    }
    #gameCanvas { 
      background: #000; border: 2px solid #38bdf8; border-radius: 8px;
      max-height: 100%; width: auto; aspect-ratio: 6 / 10;
    }
    #statusMsg { font-size: 12px; font-weight: bold; height: 18px; margin-top: 5px; }

    /* コントローラー：マークのズレを徹底修正 */
    .controls { 
      padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); 
      background: #1e293b; 
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      border-top: 1px solid #334155;
    }
    .btn { 
      height: 60px; background: #334155; color: white; border: none; 
      border-radius: 12px; font-size: 24px; font-weight: bold; 
      box-shadow: 0 4px 0 #000;
      /* Flexboxで中身を真ん中に。paddingやline-heightをリセット */
      display: flex; justify-content: center; align-items: center;
      padding: 0; line-height: 1;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { 
      grid-column: span 3; background: #e11d48; font-size: 16px; 
      box-shadow: 0 4px 0 #9f1239; height: 50px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="header">
  <input type="password" id="apiKey" placeholder="Gemini Key" />
  <button onclick="toggleBGM()" id="bgmToggle" style="background:#334155; color:white; border:none; padding:8px; border-radius:6px; font-size:10px;">🎵 BGM</button>
  <div class="score-area"><div class="score-val" id="scoreDisplay">0</div></div>
</div>

<div class="info-area">
  <div class="log-box" id="logBox"><div style="color: #64748b;">判定ボタンを押して言葉を消そう！</div></div>
  <div class="photo-frame"><img id="wordImage" style="display:none;"></div>
</div>

<div class="game-main">
  <canvas id="gameCanvas" width="240" height="400"></canvas>
  <div id="statusMsg"></div>
</div>

<div class="controls">
  <div class="btn" onpointerdown="handleMove(event, moveLeft)"><span>◀</span></div>
  <div class="btn" onpointerdown="handleMove(event, dropFast)"><span>▼</span></div>
  <div class="btn" onpointerdown="handleMove(event, moveRight)"><span>▶</span></div>
  <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ言葉を判定して消去</button>
</div>

<script>
  // 🚫 iPhoneのダブルタップズームをJavaScriptで強制禁止
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) { e.preventDefault(); }
    lastTouchEnd = now;
  }, false);

  const COLS = 6, ROWS = 10, BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null, score = 0, audioCtx = null, isBgmOn = false, bgmInterval = null;
  const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function spawnPiece() {
    currentPiece = { x: 2, y: 0, char: chars[Math.floor(Math.random() * chars.length)] };
    if (board[0][2]) {
      playSound('fail');
      alert("GAME OVER!");
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0; updateScoreDisplay();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8", false);
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff", true);
  }

  function drawBlock(x, y, char, bg, textColor, isActive) {
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 8); ctx.fill();
    if(isActive) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = textColor; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++;
    else { board[currentPiece.y][currentPiece.x] = currentPiece.char; spawnPiece(); }
    draw();
  }

  function canMove(nx, ny) { return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !board[ny][nx]; }
  function handleMove(e, func) { e.preventDefault(); func(); } // ズーム防止用
  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); playSound('move'); } }

  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    
    // 音声を即座に初期化（iPhone対策）
    initAudio(); 
    const judgeBtn = document.getElementById('judgeBtn'), statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    let candidates = [];
    for (let r = 0; r < ROWS; r++) {
      let line = board[r].map(c => c || ' ').join('');
      line.split(' ').forEach(s => { if(s.length >= 2) candidates.push(s); });
    }
    for (let c = 0; c < COLS; c++) {
      let line = "";
      for (let r = 0; r < ROWS; r++) line += (board[r][c] || ' ');
      line.split(' ').forEach(s => { if(s.length >= 2) candidates.push(s); });
    }
    candidates = [...new Set(candidates)];
    if (candidates.length === 0) { judgeBtn.disabled = false; return; }

    try {
      statusMsg.style.color = "#38bdf8"; statusMsg.textContent = "AI判定中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const targetModel = localStorage.getItem('last_word_model') || models[0].name;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${targetModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `日本語判定。以下から意味の通じる単語のみ抽出しJSONで返せ。リスト: ${JSON.stringify(candidates)} 形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "解説", "photo_en": "Prompt"}]}` }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      if (response.ok) {
        const data = await response.json();
        const result = JSON.parse(data.candidates[0].content.parts[0].text);
        if (result.valid_words && result.valid_words.length > 0) {
          playSound('success');
          statusMsg.style.color = "#4ade80"; statusMsg.textContent = "単語を発見！";
          result.valid_words.forEach(w => {
            addLog(w.word, w.score, w.comment); score += w.score;
            eraseWord(w.word); if (w.photo_en) showImage(w.photo_en);
          });
          applyGravity(); updateScoreDisplay();
          localStorage.setItem('last_word_model', targetModel);
        } else {
          // ★ 該当なし：ここで音を鳴らす
          playSound('fail');
          statusMsg.style.color = "#e11d48"; statusMsg.textContent = "該当なしでした...";
          addLog("該当なし", 0, "有効な単語が見つかりませんでした。");
        }
      }
    } catch (err) { console.error(err); }
    finally { judgeBtn.disabled = false; draw(); setTimeout(() => statusMsg.textContent = "", 3000); }
  }

  function eraseWord(word) {
    for (let r = 0; r < ROWS; r++) {
      let rowStr = board[r].map(c => c || ' ').join('');
      let idx = rowStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[r][idx + i] = null;
    }
    for (let c = 0; c < COLS; c++) {
      let colStr = "";
      for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      let idx = colStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[idx + i][c] = null;
    }
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let emptyRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          let temp = board[r][c]; board[r][c] = null; board[emptyRow][c] = temp; emptyRow--;
        }
      }
    }
  }

  function updateScoreDisplay() { document.getElementById('scoreDisplay').textContent = score; }
  function addLog(word, pts, comment) {
    const box = document.getElementById('logBox'), div = document.createElement('div');
    div.innerHTML = `<b style="color:${pts > 0 ? '#4ade80' : '#e11d48'};">『${word}』</b> ${pts > 0 ? '+'+pts+'pt' : ''}<br>${comment}`;
    box.prepend(div);
  }
  function showImage(p) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", cute 3D emoji") }?width=200&height=200&nologo=true`;
    img.style.display = 'block';
  }

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(t) {
    initAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(t==='move'){ o.frequency.value=400; g.gain.value=0.05; o.start(); o.stop(now+0.05); }
    if(t==='fail'){ // 強力なブザー音
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(140, now);
      o.frequency.linearRampToValueAtTime(100, now + 0.4);
      g.gain.setValueAtTime(0.2, now);
      g.gain.linearRampToValueAtTime(0.01, now + 0.4);
      o.start(); o.stop(now + 0.4);
    }
    if(t==='success'){ [523,659,784].forEach((f,i)=>{
      const oo=audioCtx.createOscillator(), gg=audioCtx.createGain();
      oo.connect(gg); gg.connect(audioCtx.destination); oo.frequency.value=f;
      gg.gain.setValueAtTime(0.1, now+i*0.1); oo.start(now+i*0.1); oo.stop(now+i*0.1+0.2);
    });}
  }

  function toggleBGM() {
    initAudio(); isBgmOn = !isBgmOn;
    document.getElementById('bgmToggle').style.background = isBgmOn ? "#e11d48" : "#334155";
    if(isBgmOn) {
      bgmInterval = setInterval(() => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.type='triangle';
        o.frequency.value=[261,329,392][Math.floor(Math.random()*3)]; g.gain.value=0.015;
        o.start(); o.stop(audioCtx.currentTime+0.2);
      }, 300);
    } else clearInterval(bgmInterval);
  }

  spawnPiece();
  setInterval(update, 1000);
</script>
</body>
</html>
