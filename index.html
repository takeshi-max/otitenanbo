<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔤 AIワードパズル Pro Ver.2.0</title>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', sans-serif; background: #090d16; color: white; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
    
    /* ヘッダー */
    .header { padding: 10px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 2px solid #38bdf8; }
    input[type="password"] { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 10px; touch-action: auto; }
    .score-area { text-align: right; min-width: 80px; }
    .score-val { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .ver-tag { font-size: 8px; color: #64748b; position: absolute; top: 0; left: 10px; }

    .head-btn { padding: 8px 10px; font-size: 10px; border-radius: 6px; border: none; color: white; cursor: pointer; font-weight: bold; }
    #bgmToggle { background: #e11d48; }
    #pauseBtn { background: #334155; }

    /* 情報エリア */
    .info-area { display: flex; gap: 8px; padding: 8px; background: #0f172a; height: 85px; position: relative; }
    .log-box { flex: 1; background: #1e293b; border-radius: 8px; padding: 6px; font-size: 11px; overflow-y: auto; border: 1px solid #334155; touch-action: pan-y; }
    .photo-frame { width: 68px; height: 68px; background: #000; border-radius: 8px; border: 1px solid #38bdf8; overflow: hidden; flex-shrink: 0; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; }

    /* ゲームメイン */
    .game-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; position: relative; }
    #gameCanvas { background: #000; border: 2px solid #38bdf8; border-radius: 8px; max-height: 100%; width: auto; aspect-ratio: 6 / 10; }
    #statusMsg { font-size: 11px; font-weight: bold; height: 18px; margin-top: 5px; text-align: center; }

    /* 操作パネル */
    .controls { padding: 10px 15px calc(15px + env(safe-area-inset-bottom)); background: #1e293b; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-top: 1px solid #334155; }
    .btn { height: 60px; background: #334155; color: white; border: none; border-radius: 12px; font-size: 28px; font-weight: bold; box-shadow: 0 4px 0 #000; display: flex; justify-content: center; align-items: center; padding: 0; line-height: 1; }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 16px; box-shadow: 0 4px 0 #9f1239; height: 50px; }

    /* ゲームオーバー画面（新設） */
    #gameOverOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 1000; display: none;
      flex-direction: column; justify-content: center; align-items: center; padding: 30px;
    }
    .history-list { width: 100%; max-height: 250px; overflow-y: auto; background: #1e293b; border-radius: 12px; padding: 15px; margin: 20px 0; border: 1px solid #334155; touch-action: pan-y; }
    .history-item { border-bottom: 1px solid #334155; padding: 10px 0; display: flex; justify-content: space-between; font-size: 16px; }
    .retry-btn { background: #38bdf8; color: black; padding: 18px 50px; border-radius: 50px; font-weight: bold; border: none; font-size: 20px; box-shadow: 0 4px 0 #0369a1; }
    .retry-btn:active { transform: translateY(2px); box-shadow: none; }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="ver-tag">APP Ver. 2.0 (Survival Mode)</div>

<div class="header">
  <input type="password" id="apiKey" placeholder="Gemini API Key" />
  <button onclick="togglePause()" id="pauseBtn" class="head-btn">⏸ 停止</button>
  <button onclick="toggleBGM()" id="bgmToggle" class="head-btn">🎵 BGM: ON</button>
  <div class="score-area">
    <div id="speedLabel" style="font-size: 8px; color: #94a3b8; text-align: center;">SPD: 1.0x</div>
    <div class="score-val" id="scoreDisplay">100</div>
  </div>
</div>

<div class="info-area">
  <div class="log-box" id="logBox"><div style="color: #38bdf8;">画面をタップして開始！<br>0点になるか、上まで積まれると終了！</div></div>
  <div class="photo-frame"><img id="wordImage" style="display:none;"></div>
</div>

<div class="game-main">
  <canvas id="gameCanvas" width="240" height="400"></canvas>
  <div id="statusMsg"></div>
</div>

<div class="controls">
  <div class="btn" ontouchstart="handleTouch(event, moveLeft)">◀</div>
  <div class="btn" ontouchstart="handleTouch(event, dropFast)">▼</div>
  <div class="btn" ontouchstart="handleTouch(event, moveRight)">▶</div>
  <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ言葉を判定して消去</button>
</div>

<!-- 新設：ゲームオーバー画面 -->
<div id="gameOverOverlay">
  <h2 style="color:#ff4d4d; font-size: 40px; margin:0; text-shadow: 0 0 10px rgba(255,0,0,0.5);">GAME OVER</h2>
  <div id="finalScore" style="font-size: 24px; margin: 15px 0; color:#38bdf8; font-weight:bold;">Score: 0</div>
  <div style="font-size: 14px; color:#94a3b8; margin-top:10px;">今回の単語履歴:</div>
  <div class="history-list" id="historyList"></div>
  <button class="retry-btn" onclick="resetGame()">RETRY</button>
</div>

<script>
  // 🚫 iPhone連打ズーム強制無効化
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  const COLS = 6, ROWS = 10, BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null, score = 100, audioCtx = null, isBgmOn = true, bgmInterval = null, isPaused = false;
  let gameSpeed = 1000, gameTimer = null;
  let wordHistory = []; // 消した単語の履歴

  const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  window.addEventListener('touchstart', function() {
    initAudio();
    if (isBgmOn && !bgmInterval) startBGM();
    if (!gameTimer) startGameLoop();
  }, { once: true });

  function spawnPiece() {
    currentPiece = { x: 2, y: 0, char: chars[Math.floor(Math.random() * chars.length)] };
    if (board[0][2]) triggerGameOver();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8", false);
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff", true);
    if (isPaused && document.getElementById('gameOverOverlay').style.display !== "flex") {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "white"; ctx.font = "bold 30px sans-serif"; ctx.textAlign = "center"; ctx.fillText("PAUSED", canvas.width/2, canvas.height/2);
    }
  }

  function drawBlock(x, y, char, bg, textColor, isActive) {
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 8); ctx.fill();
    if(isActive) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = textColor; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function startGameLoop() {
    if (gameTimer) clearTimeout(gameTimer);
    gameTimer = setTimeout(() => { update(); startGameLoop(); }, gameSpeed);
  }

  function update() {
    if (isPaused || !currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      if (gameSpeed > 200) gameSpeed -= 10;
      document.getElementById('speedLabel').textContent = `SPD: ${(1000 / gameSpeed).toFixed(1)}x`;
      spawnPiece();
    }
    draw();
  }

  // スコア更新ロジック（0点判定・色変更）
  function updateScore(pts) {
    score += pts;
    if (score <= 0) {
      score = 0;
      document.getElementById('scoreDisplay').textContent = score;
      triggerGameOver();
    } else {
      document.getElementById('scoreDisplay').textContent = score;
      // 減点時は一瞬赤くする演出
      if (pts < 0) {
        document.getElementById('scoreDisplay').style.color = "#ff4d4d";
        setTimeout(() => document.getElementById('scoreDisplay').style.color = "#38bdf8", 500);
      }
    }
  }

  // ゲームオーバー発動
  function triggerGameOver() {
    isPaused = true;
    playSound('fail');
    document.getElementById('finalScore').textContent = "Score: " + score;
    const list = document.getElementById('historyList');
    list.innerHTML = wordHistory.length ? "" : "<div style='text-align:center; color:#64748b; padding-top:20px;'>消した単語はありませんでした</div>";
    
    // 履歴を新しい順に表示
    [...wordHistory].reverse().forEach(w => {
      const item = document.createElement('div');
      item.className = "history-item";
      item.innerHTML = `<span>${w.word}</span><span style="color:#4ade80;">+${w.pts}pt</span>`;
      list.appendChild(item);
    });
    
    document.getElementById('gameOverOverlay').style.display = "flex";
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  }

  function resetGame() {
    board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
    score = 100; gameSpeed = 1000; isPaused = false; wordHistory = [];
    document.getElementById('gameOverOverlay').style.display = "none";
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('speedLabel').textContent = "SPD: 1.0x";
    document.getElementById('logBox').innerHTML = '<div style="color: #38bdf8;">再挑戦スタート！</div>';
    if(isBgmOn) startBGM();
    spawnPiece(); draw();
  }

  function canMove(nx, ny) { return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !board[ny][nx]; }
  function handleTouch(e, func) { if(e) e.preventDefault(); if(isPaused) return; initAudio(); func(); }
  function moveLeft() { if (canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); playSound('move'); }

  function extractAllSubstrings(line) {
    let result = []; let segments = line.split(' ');
    segments.forEach(seg => {
      if (seg.length < 2) return;
      for (let start = 0; start < seg.length; start++) {
        for (let end = start + 2; end <= seg.length; end++) {
          result.push(seg.substring(start, end));
        }
      }
    });
    return result;
  }

  async function checkWords() {
    if(isPaused) return;
    initAudio();
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    const judgeBtn = document.getElementById('judgeBtn'), statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    let candidates = [];
    for (let r = 0; r < ROWS; r++) candidates.push(...extractAllSubstrings(board[r].map(c => c || ' ').join('')));
    for (let c = 0; c < COLS; c++) {
      let colStr = ""; for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      candidates.push(...extractAllSubstrings(colStr));
    }
    candidates = [...new Set(candidates)];
    if (candidates.length === 0) { playSound('fail'); statusMsg.textContent = "並んでいません"; judgeBtn.disabled = false; return; }

    try {
      statusMsg.style.color = "#38bdf8"; statusMsg.textContent = "AI判定中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const targetModel = localStorage.getItem('last_working_word_model') || models[0].name;

      const prompt = `日本語単語パズル。リストから実在する単語（2文字以上、一般的、助詞のみ不可）のみ厳格に抽出しJSONで返せ。リスト: ${JSON.stringify(candidates)} 形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "意味", "photo_en": "Prompt"}]}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${targetModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      });

      if (response.ok) {
        const data = await response.json();
        const result = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim());
        
        if (result.valid_words && result.valid_words.length > 0) {
          playSound('success');
          statusMsg.style.color = "#4ade80"; statusMsg.textContent = "発見！";
          result.valid_words.sort((a,b)=>b.word.length - a.word.length).forEach(w => {
            addLog(w.word, w.score, w.comment);
            updateScore(w.score); // スコア加算
            wordHistory.push({word: w.word, pts: w.score}); // 履歴保存
            eraseWord(w.word); if (w.photo_en) showImage(w.photo_en);
          });
          applyGravity(); localStorage.setItem('last_working_word_model', targetModel);
        } else {
          playSound('fail');
          updateScore(-50); // ★ペナルティ：該当なしは-50点
          statusMsg.style.color = "#ff4d4d";
          statusMsg.textContent = "該当なし (-50pt)";
          addLog("該当なし", -50, "お手付きペナルティが発生しました");
        }
      }
    } catch (err) { console.error(err); }
    finally { judgeBtn.disabled = false; draw(); setTimeout(() => { if(!isPaused) statusMsg.textContent = ""; }, 3000); }
  }

  function eraseWord(word) {
    for (let r = 0; r < ROWS; r++) {
      let rowStr = board[r].map(c => c || ' ').join('');
      let idx = rowStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[r][idx + i] = null;
    }
    for (let c = 0; c < COLS; c++) {
      let colStr = ""; for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      let idx = colStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[idx + i][c] = null;
    }
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let emptyRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          let temp = board[r][c]; board[r][c] = null; board[emptyRow][c] = temp; emptyRow--;
        }
      }
    }
  }

  function addLog(word, pts, comment) {
    const box = document.getElementById('logBox'), div = document.createElement('div');
    div.innerHTML = `<b style="color:${pts >= 0 ? '#4ade80' : '#ff4d4d'};">『${word}』</b> ${pts !== 0 ? (pts > 0 ? '+'+pts : pts)+'pt' : ''}<br>${comment}`;
    box.prepend(div);
  }

  function showImage(p) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", cute 3D emoji style, neon") }?width=200&height=200&nologo=true`;
    img.style.display = 'block';
  }

  function playSound(t) {
    initAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(t==='move'){ o.frequency.value=400; g.gain.value=0.02; o.start(); o.stop(now+0.05); }
    if(t==='fail'){
      o.type='sawtooth'; o.frequency.setValueAtTime(140, now);
      o.frequency.linearRampToValueAtTime(100, now + 0.4);
      g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0.01, now + 0.4);
      o.start(); o.stop(now + 0.4);
    }
    if(t==='success'){ [523,659,784].forEach((f,i)=>{
      const oo=audioCtx.createOscillator(), gg=audioCtx.createGain();
      oo.connect(gg); gg.connect(audioCtx.destination); oo.frequency.value=f;
      gg.gain.setValueAtTime(0.05, now+i*0.1); oo.start(now+i*0.1); oo.stop(now+i*0.1+0.2);
    });}
  }

  function startBGM() {
    if (bgmInterval) return;
    bgmInterval = setInterval(() => {
      if(!isBgmOn || isPaused) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.type='triangle';
      o.frequency.value=[261,329,392][Math.floor(Math.random()*3)]; g.gain.value=0.008;
      o.start(); o.stop(audioCtx.currentTime+0.2);
    }, 300);
  }

  function toggleBGM() {
    initAudio(); isBgmOn = !isBgmOn;
    document.getElementById('bgmToggle').style.background = isBgmOn ? "#e11d48" : "#334155";
    document.getElementById('bgmToggle').textContent = isBgmOn ? "🎵 BGM: ON" : "🎵 BGM: OFF";
    if(isBgmOn && !bgmInterval && !isPaused) startBGM();
    else if(!isBgmOn && bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  }

  spawnPiece();
  draw();
</script>
</body>
</html>
