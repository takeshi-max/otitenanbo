<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔤 AIワードパズル Pro</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: none; 
      -webkit-user-select: none; 
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #090d16; color: white; 
      margin: 0; padding: 0; 
      height: 100dvh; display: flex; flex-direction: column; 
      overflow: hidden; overscroll-behavior: none;
    }

    /* ヘッダー */
    .header { 
      padding: 10px; background: #1e293b; 
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid #334155;
    }
    input[type="password"] { 
      flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; 
      background: #0f172a; color: white; font-size: 11px; touch-action: auto;
    }
    .score-area { text-align: right; min-width: 50px; }
    .score-val { font-size: 18px; font-weight: bold; color: #38bdf8; }

    /* 情報エリア */
    .info-area { display: flex; gap: 8px; padding: 8px; background: #0f172a; height: 85px; }
    .log-box { 
      flex: 1; background: #1e293b; border-radius: 8px; padding: 6px; 
      font-size: 11px; overflow-y: auto; border: 1px solid #334155; touch-action: pan-y;
    }
    .photo-frame { width: 68px; height: 68px; background: #000; border-radius: 8px; border: 1px solid #38bdf8; overflow: hidden; flex-shrink: 0; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; }

    /* ゲーム盤面 */
    .game-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; position: relative; }
    #gameCanvas { background: #000; border: 2px solid #38bdf8; border-radius: 8px; max-height: 100%; width: auto; aspect-ratio: 6 / 10; }
    #statusMsg { font-size: 12px; font-weight: bold; height: 18px; margin-top: 5px; text-align: center; width: 100%; }

    /* 操作ボタン */
    .controls { 
      padding: 10px 15px calc(15px + env(safe-area-inset-bottom)); 
      background: #1e293b; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-top: 1px solid #334155;
    }
    .btn { 
      height: 60px; background: #334155; color: white; border: none; border-radius: 12px; font-size: 24px; font-weight: bold; 
      box-shadow: 0 4px 0 #000; display: flex; justify-content: center; align-items: center; padding: 0; line-height: 1;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; background: #475569; }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 16px; box-shadow: 0 4px 0 #9f1239; height: 50px; }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="header">
  <input type="password" id="apiKey" placeholder="Gemini API Key" />
  <button onclick="toggleBGM()" id="bgmToggle" style="background:#e11d48; color:white; border:none; padding:8px; border-radius:6px; font-size:10px;">🎵 BGM: ON</button>
  <div class="score-area"><div class="score-val" id="scoreDisplay">0</div></div>
</div>

<div class="info-area">
  <div class="log-box" id="logBox"><div style="color: #64748b;">画面をタップしてスタート！</div></div>
  <div class="photo-frame"><img id="wordImage" style="display:none;"></div>
</div>

<div class="game-main">
  <canvas id="gameCanvas" width="240" height="400"></canvas>
  <div id="statusMsg"></div>
</div>

<div class="controls">
  <div class="btn" onpointerdown="handleMove(event, moveLeft)"><span>◀</span></div>
  <div class="btn" onpointerdown="handleMove(event, dropFast)"><span>▼</span></div>
  <div class="btn" onpointerdown="handleMove(event, moveRight)"><span>▶</span></div>
  <button class="btn btn-judge" id="judgeBtn" onclick="checkWords()">💡 並んだ言葉を判定して消去</button>
</div>

<script>
  // 🚫 iPhoneズーム防止
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) { e.preventDefault(); }
    lastTouchEnd = now;
  }, false);

  const COLS = 6, ROWS = 10, BLOCK_SIZE = 40;
  const chars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null, score = 0, audioCtx = null, isBgmOn = true, bgmInterval = null;
  const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 初回タップでBGM開始
  window.addEventListener('touchstart', function() {
    initAudio();
    if (isBgmOn && !bgmInterval) startBGM();
  }, { once: true });

  function spawnPiece() {
    currentPiece = { x: 2, y: 0, char: chars[Math.floor(Math.random() * chars.length)] };
    if (board[0][2]) {
      playSound('fail');
      alert("GAME OVER!");
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0; updateScoreDisplay();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c]) drawBlock(c, r, board[r][c], "#1e293b", "#38bdf8", false);
    if (currentPiece) drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#0284c7", "#fff", true);
  }

  function drawBlock(x, y, char, bg, textColor, isActive) {
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 8); ctx.fill();
    if(isActive) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = textColor; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++;
    else { board[currentPiece.y][currentPiece.x] = currentPiece.char; spawnPiece(); }
    draw();
  }

  function canMove(nx, ny) { return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !board[ny][nx]; }
  function handleMove(e, func) { e.preventDefault(); initAudio(); func(); }
  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); playSound('move'); } }

  // 🤖 AI判定ロジック（執念のリトライ版）
  async function checkWords() {
    initAudio();
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    const judgeBtn = document.getElementById('judgeBtn'), statusMsg = document.getElementById('statusMsg');
    judgeBtn.disabled = true;

    // 文字列抽出
    let candidates = [];
    for (let r = 0; r < ROWS; r++) {
      let line = board[r].map(c => c || ' ').join('');
      line.split(' ').forEach(s => { if(s.length >= 2) candidates.push(s); });
    }
    for (let c = 0; c < COLS; c++) {
      let line = "";
      for (let r = 0; r < ROWS; r++) line += (board[r][c] || ' ');
      line.split(' ').forEach(s => { if(s.length >= 2) candidates.push(s); });
    }
    candidates = [...new Set(candidates)];
    if (candidates.length === 0) {
      playSound('fail');
      statusMsg.textContent = "並んでいる文字がありません";
      judgeBtn.disabled = false;
      return;
    }

    try {
      statusMsg.style.color = "#38bdf8";
      statusMsg.textContent = "AIモデルを探索中...";

      // 1. 利用可能なモデルをスキャン
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if(!mRes.ok) throw new Error(mData.error?.message);

      let models = mData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent"))
        .sort((a, b) => b.name.localeCompare(a.name));

      // 前回成功したモデルを優先
      const lastModel = localStorage.getItem('last_working_word_model');
      if (lastModel) models = [{name: lastModel}, ...models.filter(m => m.name !== lastModel)];

      const prompt = `日本語パズル判定。以下から実在する一般的な単語（2文字以上）を全て抽出しJSONで返せ。リスト: ${JSON.stringify(candidates)} 形式: {"valid_words": [{"word": "単語", "score": 100, "comment": "解説", "photo_en": "English Prompt"}]}`;

      let success = false;
      for (const m of models) {
        statusMsg.textContent = `試行中: ${m.name.split('/').pop()}...`;
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (response.ok) {
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(text.replace(/```json|```/g, "").trim());
            
            if (result.valid_words && result.valid_words.length > 0) {
              playSound('success');
              statusMsg.style.color = "#4ade80";
              statusMsg.textContent = `${result.valid_words.length}個の単語を消去！`;
              result.valid_words.forEach(w => {
                addLog(w.word, w.score, w.comment);
                score += w.score;
                eraseWord(w.word);
                if (w.photo_en) showImage(w.photo_en);
              });
              applyGravity(); updateScoreDisplay();
              localStorage.setItem('last_working_word_model', m.name);
            } else {
              playSound('fail');
              statusMsg.style.color = "#e11d48";
              statusMsg.textContent = "該当なしでした";
              addLog("該当なし", 0, "有効な単語なし");
            }
            success = true;
            break;
          }
        } catch (e) { console.warn(m.name + " failed", e); continue; }
      }
      if(!success) alert("すべてのAIモデルが制限中か、エラーです。時間を置いてください。");

    } catch (err) { alert("通信エラー: " + err.message); }
    finally { judgeBtn.disabled = false; draw(); setTimeout(() => statusMsg.textContent = "", 3000); }
  }

  function eraseWord(word) {
    for (let r = 0; r < ROWS; r++) {
      let rowStr = board[r].map(c => c || ' ').join('');
      let idx = rowStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[r][idx + i] = null;
    }
    for (let c = 0; c < COLS; c++) {
      let colStr = "";
      for (let r = 0; r < ROWS; r++) colStr += (board[r][c] || ' ');
      let idx = colStr.indexOf(word);
      if(idx !== -1) for(let i=0; i<word.length; i++) board[idx + i][c] = null;
    }
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let emptyRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          let temp = board[r][c]; board[r][c] = null; board[emptyRow][c] = temp; emptyRow--;
        }
      }
    }
  }

  function updateScoreDisplay() { document.getElementById('scoreDisplay').textContent = score; }
  function addLog(word, pts, comment) {
    const box = document.getElementById('logBox'), div = document.createElement('div');
    div.innerHTML = `<b style="color:${pts > 0 ? '#4ade80' : '#e11d48'};">『${word}』</b> ${pts > 0 ? '+'+pts+'pt' : ''}<br>${comment}`;
    box.prepend(div);
  }
  function showImage(p) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", cute 3D render") }?width=200&height=200&nologo=true`;
    img.style.display = 'block';
  }

  function playSound(t) {
    initAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(t==='move'){ o.frequency.value=400; g.gain.value=0.03; o.start(); o.stop(now+0.05); }
    if(t==='fail'){
      o.type='sawtooth'; o.frequency.setValueAtTime(140, now); o.frequency.linearRampToValueAtTime(100, now + 0.3);
      g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0.01, now + 0.3);
      o.start(); o.stop(now + 0.3);
    }
    if(t==='success'){ [523,659,784].forEach((f,i)=>{
      const oo=audioCtx.createOscillator(), gg=audioCtx.createGain();
      oo.connect(gg); gg.connect(audioCtx.destination); oo.frequency.value=f;
      gg.gain.setValueAtTime(0.05, now+i*0.1); oo.start(now+i*0.1); oo.stop(now+i*0.1+0.2);
    });}
  }

  function startBGM() {
    if (bgmInterval) return;
    bgmInterval = setInterval(() => {
      if(!isBgmOn) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.type='triangle';
      o.frequency.value=[261,329,392][Math.floor(Math.random()*3)]; g.gain.value=0.01;
      o.start(); o.stop(audioCtx.currentTime+0.2);
    }, 300);
  }

  function toggleBGM() {
    initAudio();
    isBgmOn = !isBgmOn;
    document.getElementById('bgmToggle').style.background = isBgmOn ? "#e11d48" : "#334155";
    document.getElementById('bgmToggle').textContent = isBgmOn ? "🎵 BGM: ON" : "🎵 BGM: OFF";
    if(isBgmOn && !bgmInterval) startBGM();
  }

  spawnPiece();
  setInterval(update, 1000);
</script>
</body>
</html>
