<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔤 AIワードパズルDrop (サウンド対応版)</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .app-container { display: flex; flex-direction: column; gap: 10px; max-width: 450px; width: 100%; }
    .card { background: #1e293b; border-radius: 16px; padding: 12px; border: 1px solid #334155; }
    
    /* ヘッダー・スコア部 */
    .header-area { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    input[type="password"] { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 11px; }
    .score-val { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .sound-btn { padding: 6px 10px; background: #334155; color: white; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }

    /* ゲームエリア */
    .game-section { text-align: center; display: flex; flex-direction: column; align-items: center; }
    #gameCanvas { background: #090d16; border: 3px solid #38bdf8; border-radius: 8px; touch-action: none; max-width: 100%; height: auto; }
    
    /* スマホ向け大型操作ボタン */
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 8px; }
    .btn { padding: 12px 0; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; user-select: none; }
    .btn:active { background: #0369a1; transform: scale(0.96); }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 15px; }
    .btn-judge:active { background: #be123c; }

    /* AI結果表示エリア */
    .ai-result-area { display: flex; gap: 10px; }
    .log-box { flex: 1; background: #0f172a; border-radius: 8px; padding: 8px; border: 1px solid #334155; height: 100px; overflow-y: auto; font-size: 12px; }
    .log-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #334155; }
    .word-title { font-weight: bold; color: #4ade80; font-size: 13px; }

    /* 単語ビジュアル */
    .photo-frame { width: 100px; height: 100px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; flex-shrink: 0; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 設定＆スコア＆BGMスイッチ -->
  <div class="card header-area">
    <input type="password" id="apiKey" placeholder="Gemini API Key" />
    <button class="sound-btn" id="bgmToggle" onclick="toggleBGM()">🎵 BGM: OFF</button>
    <div>SCORE: <span class="score-val" id="scoreDisplay">0</span></div>
  </div>

  <!-- ゲーム本体 -->
  <div class="card game-section">
    <canvas id="gameCanvas" width="240" height="400"></canvas>
    
    <!-- スマホ操作ボタン -->
    <div class="mobile-controls">
      <div class="btn" onclick="moveLeft()">◀</div>
      <div class="btn" onclick="dropFast()">▼</div>
      <div class="btn" onclick="moveRight()">▶</div>
      <div class="btn btn-judge" onclick="checkWords()">💡 単語判定！</div>
    </div>
  </div>

  <!-- AI判定ログ ＆ ビジュアル -->
  <div class="card">
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">🧠 Gemini判定 ＆ ビジュアル</div>
    <div class="ai-result-area">
      <div class="log-box" id="logBox">
        <div style="color: #64748b;">文字を並べて「単語判定！」を押してね！</div>
      </div>
      <div class="photo-frame">
        <img id="wordImage" alt="Word Image">
      </div>
    </div>
  </div>
</div>

<script>
  // --------------------------------------------------
  // 🔊 サウンド機能（Web Audio APIによる効果音・BGM）
  // --------------------------------------------------
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let isBgmOn = false;
  let bgmTimer = null;

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;

    if (type === 'move') { // 移動音
      osc.frequency.setValueAtTime(300, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'drop') { // 高速落下音
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'success') { // 成功ファンファーレ
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.08);
        g.gain.setValueAtTime(0.15, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
        o.start(now + idx * 0.08);
        o.stop(now + idx * 0.08 + 0.15);
      });
    } else if (type === 'fail') { // 失敗音
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(120, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  // ループBGM（ピコピコメロディ）
  const bgmNotes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
  let bgmStep = 0;

  function toggleBGM() {
    isBgmOn = !isBgmOn;
    document.getElementById('bgmToggle').textContent = isBgmOn ? "🎵 BGM: ON" : "🎵 BGM: OFF";
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (isBgmOn) {
      bgmTimer = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(bgmNotes[bgmStep], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
        bgmStep = (bgmStep + 1) % bgmNotes.length;
      }, 250);
    } else {
      clearInterval(bgmTimer);
    }
  }

  // --------------------------------------------------
  // 🎮 ゲームロジック
  // --------------------------------------------------
  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","ん"];
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let gameInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      playSound('fail');
      alert("ゲームオーバー！");
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0;
      updateScore(0);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#0284c7");
      }
    }
    if (currentPiece) {
      drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#f59e0b");
    }
  }

  function drawBlock(x, y, char, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    ctx.fillStyle = "white";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && board[ny][nx]) return false;
    return true;
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) { currentPiece.x--; playSound('move'); draw(); } }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) { currentPiece.x++; playSound('move'); draw(); } }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; playSound('drop'); update(); } }

  // スワイプ操作
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const diffX = e.changedTouches[0].clientX - touchStartX;
    const diffY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 30) moveRight();
      else if (diffX < -30) moveLeft();
    } else {
      if (diffY > 30) dropFast();
    }
  }, { passive: true });

  // --------------------------------------------------
  // 🤖 Gemini APIによる単語判定 (日本語エラー対応)
  // --------------------------------------------------
  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("Gemini APIキーを入力してください！");

    let candidates = [];
    for (let r = 0; r < ROWS; r++) {
      let str = "";
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) str += board[r][c];
        else {
          if (str.length >= 2) candidates.push(str);
          str = "";
        }
      }
      if (str.length >= 2) candidates.push(str);
    }

    if (candidates.length === 0) return alert("2文字以上並んでいる場所がありません！");

    const prompt = `以下の文字列リストの中から日本語として意味の通じる単語を判定してください。
リスト: ${JSON.stringify(candidates)}

JSON形式のみで出力:
{"valid_words": [{"word": "単語", "score": 100, "comment": "一言解説", "photo_en": "English image prompt"}]}`;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      if (!res.ok) {
        if (res.status === 400 || res.status === 403) throw new Error("APIキーが無効または間違っています。");
        if (res.status === 429) throw new Error("利用制限（リクエスト過多）です。少し待ってからお試しください。");
        throw new Error(`通信エラーが発生しました (コード: ${res.status})`);
      }

      const data = await res.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("Geminiからの回答を受け取れませんでした。");

      const result = JSON.parse(rawText);
      
      if (result.valid_words && result.valid_words.length > 0) {
        playSound('success');
        result.valid_words.forEach(w => {
          addLog(w.word, w.score, w.comment);
          updateScore(w.score);
          if (w.photo_en) showImage(w.photo_en);
        });
      } else {
        playSound('fail');
        addLog("該当なし", 0, "意味の通じる単語が見つかりませんでした...");
      }
    } catch(e) {
      playSound('fail');
      alert("【判定エラー】\n" + e.message);
    }
  }

  function addLog(word, pts, comment) {
    const logBox = document.getElementById('logBox');
    const div = document.createElement('div');
    div.className = "log-item";
    div.innerHTML = `<span class="word-title">『${word}』</span> (+${pts}pt)<br>${comment}`;
    logBox.prepend(div);
  }

  function updateScore(pts) {
    score += pts;
    document.getElementById('scoreDisplay').textContent = score;
  }

  function showImage(promptEn) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptEn)}?width=200&height=200&nologo=true&model=flux`;
    img.style.display = 'block';
  }

  spawnPiece();
  draw();
  gameInterval = setInterval(update, 1200);
</script>
</body>
</html>
