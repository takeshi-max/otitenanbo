<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔤 AIワードパズルDrop (スマホ対応版)</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .app-container { display: flex; flex-direction: column; gap: 12px; max-width: 450px; width: 100%; }
    .card { background: #1e293b; border-radius: 16px; padding: 12px; border: 1px solid #334155; }
    
    /* ヘッダー・スコア部 */
    .header-area { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    input[type="password"] { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 12px; }
    .score-val { font-size: 20px; font-weight: bold; color: #38bdf8; }

    /* ゲームエリア */
    .game-section { text-align: center; display: flex; flex-direction: column; align-items: center; }
    #gameCanvas { background: #090d16; border: 3px solid #38bdf8; border-radius: 8px; touch-action: none; max-width: 100%; height: auto; }
    
    /* スマホ向け大型操作ボタン */
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 10px; }
    .btn { padding: 14px 0; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; user-select: none; }
    .btn:active { background: #0369a1; transform: scale(0.96); }
    .btn-judge { grid-column: span 3; background: #e11d48; font-size: 16px; margin-top: 4px; }
    .btn-judge:active { background: #be123c; }

    /* AI結果表示エリア */
    .ai-result-area { display: flex; gap: 10px; }
    .log-box { flex: 1; background: #0f172a; border-radius: 8px; padding: 8px; border: 1px solid #334155; height: 110px; overflow-y: auto; font-size: 12px; }
    .log-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #334155; }
    .word-title { font-weight: bold; color: #4ade80; font-size: 13px; }

    /* 単語ビジュアル */
    .photo-frame { width: 110px; height: 110px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; flex-shrink: 0; }
    #wordImage { width: 100%; height: 100%; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 設定＆スコア -->
  <div class="card header-area">
    <input type="password" id="apiKey" placeholder="Gemini API Key" />
    <div>SCORE: <span class="score-val" id="scoreDisplay">0</span></div>
  </div>

  <!-- ゲーム本体 -->
  <div class="card game-section">
    <canvas id="gameCanvas" width="240" height="400"></canvas>
    
    <!-- スマホ操作ボタン -->
    <div class="mobile-controls">
      <div class="btn" onclick="moveLeft()">◀</div>
      <div class="btn" onclick="dropFast()">▼</div>
      <div class="btn" onclick="moveRight()">▶</div>
      <div class="btn btn-judge" onclick="checkWords()">💡 単語判定！</div>
    </div>
  </div>

  <!-- AI判定ログ ＆ ビジュアル -->
  <div class="card">
    <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px;">🧠 Gemini判定 ＆ ビジュアル</div>
    <div class="ai-result-area">
      <div class="log-box" id="logBox">
        <div style="color: #64748b;">文字を並べて「単語判定！」を押してね！</div>
      </div>
      <div class="photo-frame">
        <img id="wordImage" alt="Word Image">
      </div>
    </div>
  </div>
</div>

<script>
  // ゲーム設定
  const COLS = 6;
  const ROWS = 10;
  const BLOCK_SIZE = 40;
  const chars = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","ん"];
  
  let board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  let currentPiece = null;
  let score = 0;
  let gameInterval = null;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // API Keyの保存
  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

  function spawnPiece() {
    const char = chars[Math.floor(Math.random() * chars.length)];
    currentPiece = { x: 2, y: 0, char: char };
    if (board[0][2]) {
      alert("ゲームオーバー！");
      board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
      score = 0;
      updateScore(0);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawBlock(c, r, board[r][c], "#0284c7");
      }
    }
    if (currentPiece) {
      drawBlock(currentPiece.x, currentPiece.y, currentPiece.char, "#f59e0b");
    }
  }

  function drawBlock(x, y, char, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    ctx.fillStyle = "white";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(char, x * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2);
  }

  function update() {
    if (!currentPiece) return;
    if (canMove(currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    } else {
      board[currentPiece.y][currentPiece.x] = currentPiece.char;
      spawnPiece();
    }
    draw();
  }

  function canMove(nx, ny) {
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && board[ny][nx]) return false;
    return true;
  }

  function moveLeft() { if (currentPiece && canMove(currentPiece.x - 1, currentPiece.y)) currentPiece.x--; draw(); }
  function moveRight() { if (currentPiece && canMove(currentPiece.x + 1, currentPiece.y)) currentPiece.x++; draw(); }
  function dropFast() { if (currentPiece) { while(canMove(currentPiece.x, currentPiece.y + 1)) currentPiece.y++; update(); } }

  // 画面のスワイプ操作対応
  let touchStartX = 0;
  let touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const diffX = e.changedTouches[0].clientX - touchStartX;
    const diffY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 30) moveRight();
      else if (diffX < -30) moveLeft();
    } else {
      if (diffY > 30) dropFast();
    }
  }, { passive: true });

  // Gemini APIで単語判定
  async function checkWords() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");

    let candidates = [];
    for (let r = 0; r < ROWS; r++) {
      let str = "";
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) str += board[r][c];
        else {
          if (str.length >= 2) candidates.push(str);
          str = "";
        }
      }
      if (str.length >= 2) candidates.push(str);
    }

    if (candidates.length === 0) return alert("2文字以上並んでいる場所がありません！");

    const prompt = `以下の文字列リストの中から日本語として意味の通じる単語を判定してください。
リスト: ${JSON.stringify(candidates)}

JSON形式のみで出力:
{"valid_words": [{"word": "単語", "score": 100, "comment": "一言解説", "photo_en": "English image prompt"}]}`;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });
      const data = await res.json();
      const result = JSON.parse(data.candidates[0].content.parts[0].text);
      
      if (result.valid_words && result.valid_words.length > 0) {
        result.valid_words.forEach(w => {
          addLog(w.word, w.score, w.comment);
          updateScore(w.score);
          if (w.photo_en) showImage(w.photo_en);
        });
      } else {
        addLog("該当なし", 0, "意味の通じる単語がありませんでした");
      }
    } catch(e) {
      alert("判定エラー: " + e.message);
    }
  }

  function addLog(word, pts, comment) {
    const logBox = document.getElementById('logBox');
    const div = document.createElement('div');
    div.className = "log-item";
    div.innerHTML = `<span class="word-title">『${word}』</span> (+${pts}pt)<br>${comment}`;
    logBox.prepend(div);
  }

  function updateScore(pts) {
    score += pts;
    document.getElementById('scoreDisplay').textContent = score;
  }

  function showImage(promptEn) {
    const img = document.getElementById('wordImage');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptEn)}?width=200&height=200&nologo=true&model=flux`;
    img.style.display = 'block';
  }

  spawnPiece();
  draw();
  gameInterval = setInterval(update, 1200);
</script>
</body>
</html>
